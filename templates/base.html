<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Room Designer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="{{ url_for('discover') }}">Room Designer</a>
    <nav>
      <a href="{{ url_for('discover') }}" class="{{ 'on' if request.endpoint in ('discover','item_detail') }}">Discover</a>
      <a href="{{ url_for('designer') }}" class="{{ 'on' if request.endpoint=='designer' }}">Design Room</a>
      <a href="{{ url_for('rooms') }}" class="{{ 'on' if request.endpoint=='rooms' }}">My Rooms</a>
      <a href="{{ url_for('style_page') }}" class="{{ 'on' if request.endpoint in ('style_page','quiz') }}">Style</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
